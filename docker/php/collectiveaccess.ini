; PHP settings for CollectiveAccess Providence.
; Based on the guidance in the Providence installation docs, sized for
; collections that include large scans and video.

; --- Uploads -------------------------------------------------------------
; Large masters should NOT go through the browser. Use the batch media
; importer instead. These limits cover access copies and
; occasional large single uploads.
upload_max_filesize = 2G
; Keep uploads in progress on the tmp volume, not the container's own disk
upload_tmp_dir = /var/lib/collectiveaccess/tmp/uploads
post_max_size = 2100M
max_file_uploads = 100

; --- Resources -----------------------------------------------------------
; CA docs suggest 256-512M; large TIFFs and reindexing need more headroom.
; This is a ceiling, not an allocation.
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
; Complex cataloguing forms post many fields.
max_input_vars = 10000

; --- Errors --------------------------------------------------------------
; Production defaults. Errors go to the container log, not the screen.
; Set CA_STACKTRACE_ON_EXCEPTION=true in the environment while debugging.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Locale --------------------------------------------------------------
; Overridden at runtime by CA_TIMEZONE (see setup.php)
date.timezone = UTC

; --- Performance ---------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; Code is immutable inside the image, so timestamps never need checking.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Security ------------------------------------------------------------
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
